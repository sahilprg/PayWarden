# Render Blueprint for the hosted demo (render.com > New > Blueprint > pick this repo).
# Runs against the PayPal SANDBOX only; the server refuses a live PayPal URL unless ALLOW_LIVE=1.
# Free instances sleep after 15 minutes without traffic and keep state in memory, so the demo
# starts fresh after each sleep or redeploy.
services:
  - type: web
    name: paywarden
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # PayPal sandbox app credentials (developer.paypal.com > Apps & Credentials > Sandbox)
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Free Gemini key from https://aistudio.google.com/apikey (or leave blank and set ANTHROPIC_API_KEY)
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3-flash-preview,gemini-3.1-flash-lite-preview,gemini-3.8-flash
      # Random tokens generated by Render; read them in the service's Environment tab.
      - key: AGENT_API_TOKEN
        generateValue: true
      - key: OWNER_API_TOKEN
        generateValue: true
      # PAYPAL_WEBHOOK_ID is added by hand after the webhook is registered (see docs/DEPLOY.md).
      # Optional named credentials (see SECURITY.md): OWNER_TOKENS and AGENT_TOKENS, added by hand.
